</style></head><body>
<div id="app"><div id="top"><b id="logo" onclick="homeQ()" title="처음 화면">OFF THE RECORD</b><span id="loc"></span><button id="bg" onclick="bgt()" title="배경음악 켜기/끄기" aria-label="배경음악 켜기/끄기">🔊</button><button id="bm" onclick="map()">지도</button><button id="bh" onclick="hint()">힌트</button></div>

<div id="md"></div><div id="md2"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const IT={remote:['🎛️','리모콘','romote','remote'],phone:['📱','미오의 폰','phone'],card:['🪪','제작사 명함','card'],paper:['📄','대본','paper'],log:['🎧','음성 로그','log'],key:['🗝️','서랍장 키','key'],con:['📑','신작 계약서','contract'],bun:['🗂️','증거 꾸러미','bundle']};
const S={inv:[],f:{},v:'d',hc:{}};let sel=null,HS=[],Q=[],CB=null,OV={},SK='';
const EDIT=/[?&]edit/.test(location.search);
/* ---- 파일 규칙: images/bg-*(배경) ch-*(인물) cut-*(엔딩 컷) item-*(아이템), audio/*.mp3. 파일이 없으면 건너뜀 ---- */
const MISS=new Set();
const im=(k,a)=>MISS.has(k)?'':`<img ${a||''} alt="" src="images/${k}.png" onerror="const e=['jpg','jpeg','webp','PNG','JPG'],t=+(this.dataset.t||0);if(t<e.length){this.dataset.t=t+1;this.src='images/${k}.'+e[t]}else{MISS.add('${k}');console.warn('이미지를 찾을 수 없음: images/${k}.png');this.remove()}">`;

fetch('hotspots.json').then(r=>r.ok?r.json():{}).then(j=>{OV=j||{}}).catch(()=>{});
function inv(){const t=S.inv.map(k=>`<div class="c${sel==k?' s':''}${USE.has(k)?'':' p'}" data-k="${k}"><div class="ci">${[IT[k][2],IT[k][3]].filter(Boolean).map(n=>im('item-'+n,'class="ii" onload="this.parentNode.lastElementChild.style.display=\'none\'"')).join('')}<span>${IT[k][0]}</span></div><small>${IT[k][1]}</small></div>`).join('');$('#inv').innerHTML=t?t+'<small class="tip">눌러서 확인하고, 사용할 땐 끌어다 놓으세요</small>':'<small class="tip">인벤토리 비어 있음</small>'}
function give(k){if(!S.inv.includes(k))S.inv.push(k);inv();toast(IT[k][1]+' 획득')}
function rm(k){S.inv=S.inv.filter(x=>x!=k);inv()}

/* ---- 장면 · 클릭 영역 [x,y,w,h,이름,동작,필요아이템,종류] (% 단위) ---- */
function R(k,t,hs,u){SK=k;HS=hs.map((h,i)=>{const o=OV[k+':'+i];return o?[...o,...h.slice(4)]:h});$('#loc').textContent=t;
$('#stage').innerHTML=(u?img(u):'')+img(k)+HS.map((h,i)=>`<div class="h${h[7]?' '+h[7]:''}" data-i="${i}" style="left:${h[0]}%;top:${h[1]}%;width:${h[2]}%;height:${h[3]}%"><span>${h[4]}</span><i class="rz"></i></div>`).join('')+'<div id="dlg"></div>';
$('#dlg').onclick=e=>{if(e.target.closest('.bx'))adv()};if(EDIT)editInit()}
function editInit(){$('#stage').classList.add('edit');panel();document.querySelectorAll('.h').forEach(e=>{e.onpointerdown=ev=>{ev.stopPropagation();ev.preventDefault();const i=+e.dataset.i,h=HS[i],st=$('#stage').getBoundingClientRect(),rz=ev.target.classList.contains('rz'),sx=ev.clientX,sy=ev.clientY,o=h.slice(0,4);e.setPointerCapture(ev.pointerId);
e.onpointermove=m=>{const dx=(m.clientX-sx)/st.width*100,dy=(m.clientY-sy)/st.height*100;if(rz){h[2]=Math.max(2,o[2]+dx);h[3]=Math.max(2,o[3]+dy)}else{h[0]=o[0]+dx;h[1]=o[1]+dy}e.style.left=h[0]+'%';e.style.top=h[1]+'%';e.style.width=h[2]+'%';e.style.height=h[3]+'%';OV[SK+':'+i]=h.slice(0,4).map(v=>Math.round(v*10)/10);panel()}}})}

function go(h,it){sel=null;inv();if(it&&h[6]!==it)return say([['','여기에는 쓸 수 없다.']]);h[5](it)}
$('#stage').addEventListener('click',e=>{if(EDIT)return;const h=e.target.closest('.h');if(h&&(!sel||inn(h,e.clientX,e.clientY)))go(HS[h.dataset.i],sel)});
const USE=new Set(['remote','key','bun']);
const inn=(el,x,y)=>{const r=el.getBoundingClientRect(),dx=r.width*.2,dy=r.height*.2;return x>=r.left+dx&&x<=r.right-dx&&y>=r.top+dy&&y<=r.bottom-dy};
$('#inv').onclick=e=>{const c=e.target.closest('.c');if(c&&!USE.has(c.dataset.k))openItem(c.dataset.k)};
$('#inv').onpointerdown=e=>{const c=e.target.closest('.c');if(!c||!USE.has(c.dataset.k))return;const k=c.dataset.k,x=e.clientX,y=e.clientY;let m=0;const g=document.createElement('div');g.className='g';g.textContent=IT[k][0];
const mv=v=>{if(Math.hypot(v.clientX-x,v.clientY-y)>8){m=1;document.body.append(g);g.style.left=v.clientX+'px';g.style.top=v.clientY+'px'}};
const up=v=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();if(m){const h=document.elementFromPoint(v.clientX,v.clientY)?.closest('.h');if(h&&inn(h,v.clientX,v.clientY))go(HS[h.dataset.i],k)}else{sel=sel==k?null:k;inv()}};
addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)};
function pop(h){$('#md2').innerHTML=`<div class="mb"><button class="x" onclick="cp()">✕</button>${h}</div>`;$('#md2').style.display='flex'}
function cp(){$('#md2').style.display='none'}
const CTX='<h3>📑 신작 계약서</h3><p>출연 및 음성 이용 계약. …</p><p style="font-size:9px;opacity:.75">제12조 AI 학습 및 상업적 활용 포괄 동의. 갑은 을의 음성을 AI 학습 및 상업적으로 활용할 수 있다.</p><p>서명일: <b>8월 7일</b></p>';
function openItem(k){if(k=='phone')return S.f.un?phone():pat();
const L={card:'<h3>🪪 제작사 명함</h3>'+im('item-card','class="pi" onload="this.nextElementSibling.style.display=\'none\'"')+'<div class="card"><small>STUDIO HANABI</small><b>스튜디오 하나비</b><p style="margin:6px 0 0">대표 토도 슈이치</p></div>',
paper:'<h3>📄 대본</h3><div class="v">미래소년의 모험</div>',
contract:CTX,
log:'<h3>🎧 음성 로그</h3><p>MIO_voice_1011.wav · 2026-10-11<br>MIO_voice_1014.wav · 2026-10-14<br>MIO_voice_1019.wav · 2026-10-19</p>'};
pop(L[IT[k][2]]||L[k])}
