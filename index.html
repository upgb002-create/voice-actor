<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OFF THE RECORD</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--pp:#e9e2d0;--rd:#e0345a;--am:#d9a441;--bl:#4aa3ff;--ln:#2c3140}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--pp);font:15px/1.6 'Noto Sans KR',sans-serif}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;padding:0 .8em;border-bottom:1px solid var(--ln)}
#top b{font:800 1.1em 'Nanum Myeongjo',serif;letter-spacing:.04em}#top b::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rd);margin-right:7px}
#loc{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.8em;opacity:.6}
button{font:inherit;background:#232838;color:var(--pp);border:1px solid #3a4157;border-radius:6px;padding:5px 12px;cursor:pointer}button:disabled{opacity:.4}button:hover:not(:disabled){border-color:var(--am)}
#bm,#bp,#bh{display:none}#top{flex-wrap:nowrap;flex:none;margin:0 auto;background:#0d0f14;overflow:hidden}
#sw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#stage{position:relative;flex:none;width:640px;height:360px;overflow:hidden;background:linear-gradient(#1b2030,#0b0d12)}
.h{position:absolute;border:1.5px dashed #e9e2d055;background:#ffffff0c;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1em;cursor:pointer;padding:3px;line-height:1.3}.h:hover{border-color:var(--am);background:#d9a44122}
#inv{display:flex;flex:none;gap:6px;margin:0 auto;padding:4px 8px;background:#0d0f14;border-top:1px solid var(--ln);overflow-x:auto;overflow-y:hidden;align-items:center}
.c{touch-action:none;user-select:none;min-width:3em;text-align:center;border:1px solid #3a4157;border-radius:8px;padding:.1em .4em;font-size:1.5em;cursor:grab}.c small{display:block;font-size:.5em;line-height:1.2;white-space:nowrap}.c.s{border-color:var(--am);background:#d9a44122}
.g{position:fixed;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);z-index:20}
#dlg{position:absolute;inset:0;display:none;align-items:flex-end;background:#0000;z-index:12}
.bx{width:100%;margin:10px;padding:10px 14px;background:#0d0f14ee;border:1px solid #3a4157;border-radius:8px}.bx b{color:var(--am)}.bx p{margin:2px 0 0}.bx p.n{font:italic 400 1.05em/1.7 'Nanum Myeongjo',serif;color:#cfc8b6}
#md{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
.mb{background:#1a1e28;border:1px solid var(--ln);width:min(560px,94vw);max-height:92vh;overflow:auto;padding:16px;border-radius:10px;position:relative}.mb h3{margin:0 0 8px;font-family:'Nanum Myeongjo',serif}
.x{position:absolute;right:8px;top:8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .on{border-color:var(--am)}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.wk{font-size:11px;opacity:.6}
.cg{position:relative}.d{min-height:48px;border:1px solid var(--ln);font-size:12px;padding:2px;text-align:left;position:relative}.d small{display:block;font-size:10px;color:#aab;line-height:1.2}
.bl::after,.rd::after{content:'';position:absolute;inset:2px;border:2px solid var(--bl);border-radius:50%;cursor:pointer}.rd::after{border-color:var(--rd)}
#ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pg{display:grid;grid-template-columns:repeat(3,44px);gap:24px;justify-content:center;padding:20px;touch-action:none}#pg b{width:44px;height:44px;border-radius:50%;border:2px solid #5a6178}#pg b.on{background:var(--am);border-color:var(--am)}
.bub{max-width:80%;padding:6px 10px;border-radius:12px;margin:6px 0;background:#2a3040;font-size:14px}.bub i{display:block;font-size:10px;opacity:.6}.bub.me{margin-left:auto;background:#6b2a3c}
.v{writing-mode:vertical-rl;font:800 22px 'Nanum Myeongjo',serif;background:var(--pp);color:#222;padding:12px 8px;margin:6px auto;height:190px;width:max-content}
.bk{display:inline-block;margin:3px}.opt{display:block;margin:4px 0}.ev label{display:inline-block;margin:3px 8px 3px 0;font-size:13px}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}.end h1{font:800 clamp(28px,7vw,56px) 'Nanum Myeongjo',serif;margin:0}.end p{max-width:34em;margin:0;opacity:.85}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--am);padding:5px 14px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}#toast.on{opacity:1}

.h.dr{border-color:var(--am);background:#d9a44122}
.memo{background:#f1ead2;color:#111;padding:14px 18px;font:400 17px/1.9 'Nanum Myeongjo',serif}.memo h4{margin:0 0 6px;font-size:19px}.memo ol{margin:0;padding-left:20px}.memo b{color:#1e6bff;font-weight:800}
.ph{width:min(340px,92vw);margin:auto;background:#10131a;border:2px solid #3a4157;border-radius:26px;padding:12px 10px 14px;position:relative;transition:transform .6s,opacity .6s}.ph.open{transform:translateY(-40px);opacity:0}.ph.shake{animation:sk .4s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sb{display:flex;justify-content:space-between;font-size:11px;opacity:.7;padding:0 6px 6px}.tm{text-align:center;font:800 18px 'Nanum Myeongjo',serif}
#pgw{position:relative;width:194px;margin:14px auto;touch-action:none}#pg{padding:0;gap:28px;grid-template-columns:repeat(3,46px)}#pg b{width:46px;height:46px}
#pl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}#pm{text-align:center;margin:0;font-size:13px}
.ap{display:flex;gap:18px;justify-content:center;padding:30px 0}.ap button{font-size:28px;width:76px;border-radius:16px}.ap small{display:block;font-size:11px}
.mh{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:6px}.mh b{flex:1;text-align:center;margin-right:30px}
.mc{padding:8px 4px;min-height:190px}.dv{text-align:center;font-size:11px;opacity:.6;margin:4px 0 8px}
.r{display:flex;align-items:flex-end;gap:5px;margin:6px 0}.r.me{justify-content:flex-end}.r>div{max-width:78%}.r .bub{max-width:100%;margin:0}.r small{display:block;font-size:11px;opacity:.7}.r time{font-size:10px;opacity:.5}
.mi{display:flex;gap:6px;border:1px solid #3a4157;border-radius:20px;padding:5px 12px;margin-top:6px}.mi input{flex:1;background:none;border:0;color:var(--pp);font:inherit;min-width:0}.mi span{color:var(--am)}
#rot{display:none;position:fixed;inset:0;background:#000e;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
@media(orientation:portrait) and (max-width:700px){#rot{display:flex}}
.bx{position:relative;padding-right:38px;cursor:pointer}.bx::after{content:'▼';position:absolute;right:14px;bottom:7px;font-size:13px;color:var(--am);animation:bk 1.1s steps(2) infinite}@keyframes bk{50%{opacity:.25}}
#top button{font-size:1em;padding:.15em .7em;line-height:1.3;white-space:nowrap}
@media(max-height:480px){.bx{padding:6px 34px 6px 10px;margin:6px}}
.po{position:absolute;left:3%;bottom:26%;height:66%;max-width:36%;object-fit:contain;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><div id="top"><b id="logo" onclick="homeQ()" title="처음 화면" style="cursor:pointer">OFF THE RECORD</b><span id="loc"></span><button id="bg" onclick="bgt()" title="배경음악 켜기/끄기" aria-label="배경음악 켜기/끄기">🔊</button><button id="bm" onclick="map()" title="지도" aria-label="지도">지도</button><button id="bh" onclick="hint()" title="생각해보자(힌트)" aria-label="생각해보자(힌트)">힌트</button><button id="bp" onclick="S.f.un?phone():pat()" title="미오의 폰" aria-label="미오의 폰">폰</button></div>
<div id="sw"><div id="stage"></div></div><div id="inv"></div></div>
<div id="rot"><div style="font-size:40px">📱↻</div><p>가로로 돌려서 플레이해 주세요</p><button onclick="document.getElementById('rot').remove()">그냥 계속하기</button></div><div id="md"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const IT={remote:['🎛️','리모콘'],card:['🪪','제작사 명함'],paper:['📄','세로쓰기 종이'],log:['🎧','음성 로그'],key:['🗝️','서랍장 키'],con:['📑','신작 계약서'],bun:['🗂️','증거 꾸러미']};
const S={inv:[],f:{},v:'d',hc:{}};let sel=null,HS=[],Q=[],CB=null,ch=[];
/* ---- 파일 규칙: images/bg-*(배경) ch-*(인물) cut-*(엔딩 컷), audio/bgm.mp3, audio/tv-voice.mp3. 파일이 없으면 도형 UI로 보임 ---- */
const im=(k,a)=>`<img ${a||''} alt="" src="images/${k}.png" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='images/${k}.jpg'}else if(this.dataset.t==1){this.dataset.t=2;this.src='images/${k}.webp'}else this.remove()">`;
const img=k=>im(k,'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"');
const CH={'다카하시':'takahashi','대표':'kuroda','미오':'mio','유키':'yuki','탐정':'detective'};
function inv(){const t=S.inv.map(k=>`<div class="c${sel==k?' s':''}" data-k="${k}">${IT[k][0]}<small>${IT[k][1]}</small></div>`).join('');$('#inv').innerHTML=t?t+'<small style="opacity:.5;margin-left:auto;min-width:120px">끌어다 놓거나, 눌러서 선택한 뒤 대상을 누르세요</small>':'<small style="opacity:.5">인벤토리 비어 있음</small>';document.querySelectorAll('.h').forEach(h=>h.classList.toggle('dr',!!sel))}
function give(k){if(!S.inv.includes(k))S.inv.push(k);inv();toast(IT[k][1]+' 획득')}
function rm(k){S.inv=S.inv.filter(x=>x!=k);inv()}
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',1800)}
function R(k,t,hs){HS=hs;$('#loc').textContent=t;$('#stage').innerHTML=img(k)+hs.map((h,i)=>`<div class="h" data-i="${i}" style="left:${h[0]}%;top:${h[1]}%;width:${h[2]}%;height:${h[3]}%">${h[4]}</div>`).join('')+'<div id="dlg"></div>';$('#dlg').onclick=e=>{if(e.target.closest('.bx'))nx()}}
function say(a,cb){Q=a.slice();CB=cb;$('#dlg').style.display='flex';nx()}
function nx(){const l=Q.shift();if(!l){$('#dlg').style.display='none';const c=CB;CB=null;c&&c();return}$('#dlg').innerHTML=(CH[l[0]]?im('ch-'+CH[l[0]],'class="po"'):'')+`<div class="bx"><b>${l[0]}</b><p class="${l[0]?'':'n'}">${l[1]}</p></div>`}
function md(h,z){$('#md').style.zIndex=z||9;$('#md').innerHTML=`<div class="mb"><button class="x" onclick="cm()">✕</button>${h}</div>`;$('#md').style.display='flex'}
function cm(){$('#md').style.display='none'}
function go(h,it){sel=null;inv();if(it&&h[6]!==it)return say([['','여기에는 쓸 수 없다.']]);h[5](it)}
$('#stage').addEventListener('click',e=>{const h=e.target.closest('.h');if(h)go(HS[h.dataset.i],sel)});
$('#inv').onpointerdown=e=>{const c=e.target.closest('.c');if(!c)return;const k=c.dataset.k,x=e.clientX,y=e.clientY;let m=0;const g=document.createElement('div');g.className='g';g.textContent=IT[k][0];
const hl=v=>document.querySelectorAll('.h').forEach(h=>h.classList.toggle('dr',v));
const mv=v=>{if(Math.hypot(v.clientX-x,v.clientY-y)>8){if(!m){m=1;hl(1)}document.body.append(g);g.style.left=v.clientX+'px';g.style.top=v.clientY+'px'}};
const up=v=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();hl(0);if(m){const h=document.elementFromPoint(v.clientX,v.clientY)?.closest('.h');if(h)go(HS[h.dataset.i],k)}else{sel=sel==k?null:k;inv()}};
addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)};
/* ---- 시작 · 프롤로그 ---- */
function title(){inv();R('bg-title','',[]);$('#stage').innerHTML+=`<div class="end"><h1>OFF THE RECORD</h1><p>스토리 퍼즐형 미스터리 방탈출 추리 게임<br>실종된 성우, 그리고 그녀의 목소리를 쓰는 누군가.</p><button onclick="prol()">시작하기</button></div>`}
function prol(){S.go=1;bgs();R('bg-office','탐정 사무소',[]);say([['','비 오는 저녁. 책상 위에는 월세 독촉장이 세 장.'],['','독촉장이 세 장째 쌓인 날, 일은 대개 문을 두드린다.'],['대표','코에 프로덕션 대표 쿠로다 마사유키입니다. 소속 성우 이시카와 미오가 어제부터 연락이 닿지 않습니다.'],['대표','모레에 미오가 출연하는 콘서트가 있습니다. 취소되면 협찬사에 막대한 손해를 물게 됩니다.'],['대표','사라진 미오의 위치를 알려주십시오. 기한은 콘서트 전날까지.'],['대표','외부에 새어 나가선 안 됩니다. 선금은 지금, 잔금은 결과를 보고 드리겠습니다.'],['대표','저는 내일 협찬사 미팅으로 자리를 비웁니다. 결과는 전화를 통해 전달해주십시오.'],['','사라진 이유를 모른다는 사람치고는 준비가 너무 빨랐다. 대중은 아직 아무것도 모른다. 광고 속 그녀의 목소리는 오늘도 멀쩡히 흘러나오고 있었다.']],()=>{$('#bm').style.display=$('#bh').style.display='inline-block';toast('지도와 인벤토리가 열렸다');map()})}
function map(){cm();R('bg-map','지도',[[6,30,26,32,'🏠 미오의 집',home],[38,14,26,32,S.f.c1?'🏢 코에 프로덕션':'🔒 ???',()=>S.f.c1?lobby():toast('아직 갈 수 없다')],[68,42,26,32,S.f.hotel?'🏨 호텔 아오조라 신주쿠':'🔒 ???',()=>S.f.hotel?hotel():toast('아직 갈 수 없다')]])}
/* ---- 챕터 1: 미오의 집 ---- */
function home(){if(!S.f.h){S.f.h=1;R('bg-home','미오의 집',[]);say([['다카하시','미오 씨 연락이 안 돼서 저도 걱정이 많습니다. 집 열쇠는 제가 맡아두고 있어요. 저는 밖에서 기다리겠습니다.'],['','매니저는 문을 열어주고 자리를 떠났다.']],room)}else room()}
function room(){const o=S.f.dr;R('bg-home','미오의 집 · 방과 거실',[
[5,12,30,40,'📺 TV',it=>{if(!S.f.tv){if(it!='remote')return say([['','TV는 꺼져 있다. 리모콘이 필요하다.']]);rm('remote');S.f.tv=1}tvOn()},'remote'],
[40,60,16,14,S.f.rc?'(빈 탁자)':'🎛️ 리모콘',()=>{if(S.f.rc)return;S.f.rc=1;give('remote');room()}],
[58,10,26,38,'🗓️ 달력',()=>cal(12)],
o?[58,58,12,18,'📱 미오의 휴대전화',()=>{S.f.ph=1;$('#bp').style.display='inline-block';S.f.un?phone():pat()}]:[58,56,26,34,'🗄️ 서랍장',openD],
o?[72,58,12,18,'📝 미오의 메모장',memo]:null].filter(Boolean))}
function tvOn(){try{tvA.currentTime=0;tvA.play().catch(()=>{})}catch(e){}say([['','리모콘으로 TV를 켜자 신작 애니의 대사가 흘러나왔다. 11월 28일에 방영을 시작해 지금도 방영 중인 작품이다.'],['','주인공의 목소리가 낯익다. 미오의 목소리다. 하지만 미오가 출연한 적 없는 작품이다. 본인이 아닌, AI로 복제된 목소리.'],['','엔딩 크레딧 끝에 제작사 로고가 떴다. 미오는 이 작품을 알고 대표에게 항의했던 걸까. 달력의 “확인할 것”이 떠올랐다.']])}
function openD(){S.f.dr=1;sfx.ok();room();say([['','서랍을 열었다. 안에는 미오의 휴대전화와 메모장이 들어 있다.']])}
function memo(){md(`<h3>📝 미오의 메모장</h3><div class="memo"><h4>11월에 꼭 지킬 것!</h4><ol><li><b>화요일</b>에는 녹음 끝나고 목 관리받기</li><li>새 대본 <b>월요일</b>에 받기로 했으니까 캐릭터 분석하기!</li><li><b>일요일</b>에는 다음 주 녹음 준비하고 일찍 자기</li><li>그리고 <b>일요일</b>에는 일정 정리도 다시 할 것!</li></ol><p style="margin:8px 0 0">요즘 목 상태가 별로니까 무리하지 말 것!</p></div>`)}
const SC={10:{1:'장보기',3:'미용실',8:'치과',17:'엄마 생신',21:'영화',24:'친구 약속',29:'대청소'},11:{6:'세탁소',9:'택배 수령',12:'운동',19:'영화',21:'장보기',26:'친구 약속',28:'확인할 것'},12:{4:'치과',9:'택배 수령',13:'친구 생일',17:'장보기',24:'D-DAY<br>콘서트날'}},B=[1,3,15,16];
function cal(m,ph){const f=new Date(2026,m-1,1).getDay(),n=new Date(2026,m,0).getDate();let c='';for(let i=0;i<f;i++)c+='<i></i>';
for(let d=1;d<=n;d++){const t=SC[m]?.[d]||'',b=m==11&&B.includes(d),rd=m==12&&d==24;c+=`<div class="d${b?' bl':''}${rd?' rd':''}">${d}<small>${t}${rd?'<br>이날 직접 말한다':''}</small></div>`}
